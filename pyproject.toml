[build-system]
requires = ["setuptools>=84.2.1", "setuptools_scm[toml]>=10.3.4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epac-flatbuffer-formats"
dependencies = [
    "flatbuffers==25.12.19",
    "numpy~=2.5",
    "pydantic~=2.14"
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "flake8",
    "Flake8-pyproject",
    "pytest",
    "pytest-benchmark",
    "pdoc",
    "hypothesis",
    "p4p",
    "maturin>=1.16.0"
]

[tool.setuptools_scm]
version_file = "src/epac/flatbuffers/_version.py"

[tool.mypy]
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = "flatbuffers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["epac_flatbuffer_formats_rs"]
ignore_missing_imports = true

[tool.black]
extend-exclude ="epac_flatbuffer_formats_rs.pyi"

[tool.flake8]
extend-ignore = [
    "E501", # line too long
]

max-line-length = 88 # Respect black's line length (default 88),
exclude = [
    ".venv",
    ".git",
    "build",
    # Generated code
    "src/epac/flatbuffers/fbschemas",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "rust/epac-flatbuffer-formats-rs/python/tests",
]
