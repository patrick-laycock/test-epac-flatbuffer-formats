version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "development"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "15:18"
      timezone: "Europe/London"

    groups:
      python-dependencies:
        patterns:
          - "*"

  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/Rust"
    target-branch: "development"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "15:18"
      timezone: "Europe/London"

    groups:
      rust-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "15:18"
      timezone: "Europe/London"

    groups:
      github-actions:
        patterns:
          - "*"
